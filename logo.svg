*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#050505;
    color:white;
    text-align:center;
}

.hero{
    padding:30px 15px;
    background:linear-gradient(180deg,#000,#151000);
}

.hero img{
    width:220px;
    height:220px;
    object-fit:contain;
    filter:drop-shadow(0 0 20px #ffd700);
}

.hero h1{
    margin-top:20px;
    font-size:32px;
    color:#ffd700;
    text-shadow:0 0 15px #ffd700;
}

.hero h2{
    font-size:22px;
    margin:15px 0;
}

.hero p{
    font-size:18px;
    color:#ddd;
}


.features{
    padding:40px 15px;
}

.features h2{
    font-size:38px;
    color:#ffd700;
    text-shadow:0 0 20px #ffd700;
    margin-bottom:30px;
}


.feature-container{
    display:flex;
    flex-direction:column;
    gap:18px;
    align-items:center;
}


.feature-card{
    width:90%;
    max-width:350px;
    padding:18px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,215,0,0.4);
    backdrop-filter:blur(10px);
    color:white;
    text-decoration:none;
    font-size:22px;
    box-shadow:0 0 20px #222;
    transition:.3s;
}


.feature-card:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px #ffd700;
}


.feature-icon{
    font-size:35px;
    margin-bottom:8px;
}


.video-gallery{
    padding:30px 10px;
}


.video-gallery h2{
    color:#ffd700;
}


@media(max-width:600px){

.hero h1{
    font-size:26px;
}

.hero h2{
    font-size:18px;
}

.feature-card{
    font-size:18px;
}

}
