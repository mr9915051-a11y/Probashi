<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BPMF - High Security App</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap');
        body { background-color: #010409; font-family: 'Hind Siliguri', sans-serif; color: white; margin: 0; }
        .app-shell { max-width: 500px; margin: auto; min-height: 100vh; background: #010409; position: relative; padding-bottom: 80px; }
        .hero { background: linear-gradient(180deg, #1e3a8a 0%, #010409 100%); padding: 40px 15px; text-align: center; border-bottom: 2px solid #ffd700; }
        .logo-box { width: 85px; height: 85px; margin: 0 auto 15px; border-radius: 50%; background: white; border: 3px solid #ffd700; padding: 2px; box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
        .grid-layout { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 20px 10px; }
        
        /* 3D Orb Icon */
        .orb {
            width: 60px; height: 60px; 
            background: linear-gradient(145deg, #3b82f6, #1e40af);
            border-radius: 50%; margin: 0 auto 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: white;
            box-shadow: inset -5px -5px 12px rgba(0,0,0,0.5), inset 5px 5px 12px rgba(255,255,255,0.2), 0 10px 20px rgba(0,0,0,0.4);
        }
        .orb-label { font-size: 10px; color: #e2e8f0; font-weight: 700; line-height: 1.2; text-align: center; }

        /* Admin Sheet */
        .secure-panel { 
            display: none; position: fixed; bottom: 0; left: 0; right: 0; 
            background: #0d1117; padding: 25px; border-top: 4px solid #ffd700; 
            border-radius: 30px 30px 0 0; z-index: 1000; max-width: 500px; margin: auto;
            box-shadow: 0 -20px 50px rgba(0,0,0,0.9);
        }
        input, select { background: #161b22; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 12px; width: 100%; margin-bottom: 12px; outline: none; }
    </style>
</head>
<body>

<div class="app-shell">
    <div class="hero">
        <div class="logo-box"><img src="https://i.ibb.co/LhqZzX6/logo.png" class="w-full h-full rounded-full"></div>
        <h1 class="text-xl font-black text-yellow-500 uppercase">বাংলাদেশ প্রবাসী মঞ্চ ফাউন্ডেশন</h1>
        <p class="text-[9px] text-blue-300 tracking-[2px] font-bold">একতা • সেবা • উন্নয়ন</p>
    </div>

    <div id="main-grid" class="grid-layout">
        <!-- Icons Load Here -->
    </div>

    <div class="text-center py-20">
        <button onclick="openLogin()" class="text-gray-800 text-[8px] tracking-[6px] uppercase opacity-20">Secure Entry</button>
    </div>
</div>

<!-- Login Box -->
<div id="login-box" class="hidden fixed inset-0 bg-black/95 backdrop-blur-md flex items-center justify-center z-[2000] p-6">
    <div class="bg-[#0d1117] p-8 rounded-[40px] w-full max-w-xs text-center border border-yellow-500/20 shadow-2xl">
        <h3 class="text-yellow-500 font-bold mb-6">ADMIN AUTHORIZATION</h3>
        <input type="text" id="u-name" placeholder="USERNAME" class="uppercase text-center">
        <input type="password" id="u-pass" placeholder="PASSWORD" class="text-center">
        <button onclick="handleLogin()" class="w-full bg-yellow-500 text-black p-4 rounded-2xl font-black uppercase">Login</button>
        <button onclick="document.getElementById('login-box').classList.add('hidden')" class="mt-4 text-gray-500 text-xs">Exit</button>
    </div>
</div>

<!-- Admin Panel -->
<div id="admin-panel" class="secure-panel">
    <h3 class="text-yellow-500 font-bold mb-4 text-center">ADD NEW FEATURE (4 COLUMNS)</h3>
    <input type="text" id="f-name" placeholder="Feature Name">
    <input type="text" id="f-url" placeholder="URL (e.g. facebook.com)">
    <select id="f-icon">
        <option value="fab fa-facebook">Facebook Icon</option>
        <option value="fab fa-whatsapp">WhatsApp Icon</option>
        <option value="fab fa-youtube">YouTube Icon</option>
        <option value="fab fa-messenger">Messenger Icon</option>
        <option value="fas fa-phone">Phone/Call</option>
        <option value="fas fa-id-card">Identity/Verify</option>
        <option value="fas fa-globe">Global Website</option>
        <option value="fas fa-envelope">Email Support</option>
    </select>
    <button onclick="saveItem()" class="w-full bg-green-600 text-white p-4 rounded-xl font-bold">SAVE FEATURE</button>
    <button onclick="sessionStorage.clear(); location.reload();" class="w-full text-red-500 text-xs mt-6">LOGOUT</button>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('bpmf_v5_db')) || { items: [] };

    function render() {
        const container = document.getElementById('main-grid');
        container.innerHTML = "";
        db.items.forEach((item, index) => {
            container.innerHTML += `
                <div class="relative">
                    <a href="${item.url}" target="_blank" class="block text-decoration-none">
                        <div class="orb"><i class="${item.icon}"></i></div>
                        <div class="orb-label">${item.name}</div>
                    </a>
                    <button onclick="deleteItem(${index})" class="adm-only hidden absolute -top-1 -right-1 bg-red-600 w-5 h-5 rounded-full text-[10px]">
                        <i class="fas fa-times"></i>
                    </button>
                </div>`;
        });
        if(sessionStorage.getItem('auth') === 'true') {
            document.getElementById('admin-panel').style.display = "block";
            document.querySelectorAll('.adm-only').forEach(b => b.classList.remove('hidden'));
        }
    }

    function openLogin() { document.getElementById('login-box').classList.remove('hidden'); }

    function handleLogin() {
        if(document.getElementById('u-name').value === "MDRAFIK159123" && document.getElementById('u-pass').value === "159123") {
            sessionStorage.setItem('auth', 'true');
            location.reload();
        } else { alert("ACCESS DENIED!"); }
    }

    function saveItem() {
        const name = document.getElementById('f-name').value;
        let url = document.getElementById('f-url').value;
        const icon = document.getElementById('f-icon').value;
        if(name && url) {
            if(!url.startsWith('http')) url = 'https://' + url;
            db.items.push({ name, url, icon });
            localStorage.setItem('bpmf_v5_db', JSON.stringify(db));
            location.reload();
        }
    }

    function deleteItem(i) {
        if(confirm("Delete?")) {
            db.items.splice(i, 1);
            localStorage.setItem('bpmf_v5_db', JSON.stringify(db));
            render();
        }
    }
    render();
</script>
</body>
</html>
